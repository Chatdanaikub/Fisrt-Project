<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.45" />
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Rounded Icon Base -->
  <rect x="36" y="36" width="440" height="440" rx="110" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Glass Border -->
  <rect x="42" y="42" width="428" height="428" rx="104" fill="none" stroke="white" stroke-width="6" stroke-opacity="0.25" />

  <!-- Background Ambient Shapes -->
  <circle cx="160" cy="160" r="80" fill="#38bdf8" opacity="0.2" filter="blur(20px)" />
  <circle cx="350" cy="350" r="90" fill="#ec4899" opacity="0.25" filter="blur(25px)" />

  <!-- Center Icon: Futuristic App Diamond & Lightning Spark -->
  <g filter="url(#innerGlow)">
    <!-- Sleek Poly Crest -->
    <path d="M256 100 L380 200 L330 380 L182 380 L132 200 Z" fill="url(#accentGrad)" opacity="0.95" />
    <!-- Inner Highlight -->
    <path d="M256 120 L358 205 L316 360 L196 360 L154 205 Z" fill="#1e1b4b" opacity="0.6" />
    <!-- Dynamic Lightning Energy Bolt -->
    <path d="M268 150 L205 265 H260 L244 350 L320 235 H264 L288 150 Z" fill="url(#boltGrad)" />
  </g>

  <!-- Accent Sparkles -->
  <polygon points="380,130 388,145 403,153 388,161 380,176 372,161 357,153 372,145" fill="#fef08a" opacity="0.9" />
  <polygon points="135,330 140,340 150,345 140,350 135,360 130,350 120,345 130,340" fill="#38bdf8" opacity="0.9" />
</svg>